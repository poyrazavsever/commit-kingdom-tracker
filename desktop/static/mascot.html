<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'" />
    <title>Tudi</title>
    <link rel="stylesheet" href="mascot.css" />
  </head>
  <body>
    <div class="stage" aria-hidden="true">
      <div class="bubble"><p></p><span class="tail"></span></div>
      <div class="tudi">
        <div class="body">
          <img data-mood="watching" src="art/tudi-code.webp" alt="" />
          <img data-mood="waiting" src="art/tudi-think.webp" alt="" />
          <img data-mood="sleeping" src="art/tudi-sleep.webp" alt="" />
          <img data-mood="cheering" src="art/tudi-cheer.webp" alt="" />
        </div>
        <div class="sleep-bubbles"><i></i><i></i><i></i></div>
      </div>
    </div>
    <script src="mascot.js"></script>
  </body>
</html>
