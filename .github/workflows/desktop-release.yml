# Builds Commit Kingdom Desktop with its tudi-cli and publishes it to GitHub Releases, where installed copies update from.
# Start a release by pushing a tag that matches desktop/package.json's version: `git tag desktop-v0.1.0 && git push --tags`.
#
# Signing:
# - macOS: signed and notarised when the Apple secrets below exist (CSC_LINK / CSC_KEY_PASSWORD: the Developer ID
#   certificate as base64 .p12; APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID for notarisation).
# - Windows: Certum SimplySign signs with the founder's session (ADR-027), so a signed Windows build is made on the
#   founder's machine and uploaded to the same release. Until the certificate exists the CI build is unsigned.
#
# Editor extensions: the JetBrains plugin is built once and carried inside Desktop (as the VSIX is), and both are
# attached to the release for installing by hand. Each marketplace is published to only when its token exists:
# VSCE_PAT (Visual Studio Marketplace, publisher tudidaily), OVSX_PAT (Open VSX), JETBRAINS_MARKETPLACE_TOKEN.
name: Commit Kingdom Desktop release

on:
  push:
    tags: ['desktop-v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  jetbrains:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jetbrains
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew test buildPlugin
      - run: cp build/distributions/*.zip tudi-tracker-jetbrains.zip
      - uses: actions/upload-artifact@v4
        with:
          name: jetbrains-plugin
          path: jetbrains/tudi-tracker-jetbrains.zip
      - name: Publish to JetBrains Marketplace (when the token exists)
        env:
          JETBRAINS_MARKETPLACE_TOKEN: ${{ secrets.JETBRAINS_MARKETPLACE_TOKEN }}
        run: if [ -n "$JETBRAINS_MARKETPLACE_TOKEN" ]; then ./gradlew publishPlugin; else echo "No JETBRAINS_MARKETPLACE_TOKEN, skipped"; fi

  build:
    needs: jetbrains
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            cli: win32-x64
            target: --win --x64
          - os: macos-latest
            cli: darwin-arm64 darwin-x64
            target: --mac --arm64 --x64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm --prefix ../vscode ci
      # The tudi-cli that ships inside Commit Kingdom Desktop must pass its tests first.
      - run: go test ./...
        working-directory: cli
      - run: npm run build:extension
      - uses: actions/download-artifact@v4
        with:
          name: jetbrains-plugin
          path: ${{ runner.temp }}/jetbrains
      - run: npm run build:jetbrains -- "${{ runner.temp }}/jetbrains/tudi-tracker-jetbrains.zip"
      - run: npm run build:cli -- ${{ matrix.cli }}
      - run: npm test
      - run: npx tsc -p . && npx electron-builder ${{ matrix.target }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # No certificate yet: build unsigned instead of failing.
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.CSC_LINK != '' }}

  extensions:
    needs: build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vscode
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: vscode/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run package
      - uses: actions/download-artifact@v4
        with:
          name: jetbrains-plugin
          path: ${{ runner.temp }}/jetbrains
      - name: Attach the extension and the plugin to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" tudi-tracker.vsix "${{ runner.temp }}/jetbrains/tudi-tracker-jetbrains.zip" --clobber
      - name: Publish to Visual Studio Marketplace (when the token exists)
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: if [ -n "$VSCE_PAT" ]; then npx vsce publish --packagePath tudi-tracker.vsix; else echo "No VSCE_PAT, skipped"; fi
      - name: Publish to Open VSX (when the token exists)
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: if [ -n "$OVSX_PAT" ]; then npx --yes ovsx@0.10.6 publish tudi-tracker.vsix -p "$OVSX_PAT"; else echo "No OVSX_PAT, skipped"; fi
